name: Build TURBO BOOST PRO (Windows)

on:
  push:
    branches: [claude/turbo-boost-pro-optimizer-p7ejzb]
    paths: ["turbo_boost_pro/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: turbo_boost_pro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt pytest

      - name: Versao
        id: ver
        run: |
          $v = (Select-String -Path tbp\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versao $v"

      - name: Testes (registro real do Windows)
        run: python -m pytest -q tests/test_journal.py

      - name: Teste de integracao (aplica e reverte modificacoes reais no Windows)
        run: python tests/windows_integration.py

      - name: Teste de fumaca dos modulos do Windows
        run: |
          python -c "import sys; sys.path.insert(0,'.'); from tbp.core.engine import engine; from tbp.core import system_mods, winver; print(winver.label()); print('Apps:', len(system_mods.list_apps()), 'Tarefas:', len(system_mods.list_tasks())); from tbp.core import power, services, startup, storage; acts = engine.plan_turbo(); print('TURBO:', len(acts), 'acoes'); print('Plano:', power.active_plan()); print('Servicos:', len(services.catalog_status())); print('Inicializacao:', len(startup.list_entries())); print('Volumes:', storage.list_volumes())"

      - name: Gerar executavel
        run: |
          python assets/make_icon.py
          pyinstaller --noconfirm --clean turbo_boost_pro.spec

      - name: Autoteste do .exe (importa todas as paginas e modulos)
        run: |
          $p = Start-Process -FilePath "dist\TurboBoostPro\TurboBoostPro.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; Write-Error "Autoteste travou"; exit 1 }
          Get-Content "$env:LOCALAPPDATA\TurboBoostPro\selftest.txt"
          if ($p.ExitCode -ne 0) { Write-Error "Autoteste falhou (codigo $($p.ExitCode))"; exit 1 }

      - name: Verificar se a janela principal abre (sem janela de erro)
        run: |
          $p = Start-Process -FilePath "dist\TurboBoostPro\TurboBoostPro.exe" -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          if ($p.HasExited) { Write-Error "O executavel fechou sozinho (codigo $($p.ExitCode))"; exit 1 }
          $title = $p.MainWindowTitle
          Write-Host "Titulo da janela: '$title'"
          if ($title -notlike "TURBO BOOST PRO*") { Write-Error "Janela principal nao abriu (titulo: '$title')"; exit 1 }
          Stop-Process -Id $p.Id -Force

      - name: Gerar instalador
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\turbo_boost_pro.iss
          Compress-Archive -Path dist\TurboBoostPro\* -DestinationPath TurboBoostPro_Portatil.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TurboBoostPro-Windows
          path: |
            turbo_boost_pro/installer/Output/*.exe
            turbo_boost_pro/TurboBoostPro_Portatil.zip

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: turbo-boost-pro-v${{ steps.ver.outputs.version }}
          name: TURBO BOOST PRO ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            **TurboBoostPro_Setup_${{ steps.ver.outputs.version }}.exe**: instalador (cria atalho na Area de Trabalho).
            **TurboBoostPro_Portatil.zip**: versao sem instalacao.
          files: |
            turbo_boost_pro/installer/Output/TurboBoostPro_Setup_${{ steps.ver.outputs.version }}.exe
            turbo_boost_pro/TurboBoostPro_Portatil.zip
